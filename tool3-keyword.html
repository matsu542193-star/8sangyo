 <script>
  (function(){

          overlay.id='pw-overlay';

  .gbp-template { background: #f8faff; border: 1.5px solid #dde3ee; border-radius: 10px; padding: 18px; font-size: 0.9rem; line-height: 1.8; white-space: pre-wrap; color: #1a2e4a; }

  .section-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
  .copy-btn { background: #d4a017; color: #1a2e4a; border: none; padding: 7px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.82rem; font-family: inherit; transition: opacity 0.2s; }
  .copy-btn:hover { opacity: 0.85; }

  .error-msg { color: #c0392b; font-size: 0.85rem; background: #fff5f5; border: 1px solid #fcc; border-radius: 8px; padding: 10px 14px; margin-top: 10px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1a2e4a; color: #fff; padding: 10px 24px; border-radius: 30px; font-size: 0.85rem; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .copy-hint { font-size: 0.75rem; color: #999; margin-top: 6px; }

</head>
<body>

<div class="container">
  <div class="card">
    <h2>MEOキーワードチェッカー</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>業種</label>
        <select id="industry">
          <option value="蜂の巣駆除">蜂の巣駆除</option>
          <option value="害虫駆除">害虫駆除</option>
          <option value="害獣駆除">害獣駆除</option>
          <option value="清掃業">清掃業</option>
          <option value="リフォーム">リフォーム</option>
          <option value="飲食店">飲食店</option>
          <option value="美容院">美容院</option>
          <option value="整体・治療院">整体・治療院</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="form-group">
        <label>エリア（市区町村）</label>
        <input type="text" id="area" placeholder="例：飯能市、入間市">
      </div>
      <div class="form-group full">
        <label>メインサービス</label>
        <input type="text" id="service" placeholder="例：アシナガバチ・スズメバチの駆除、即日対応">
      </div>
    </div>
    <button class="generate-btn" onclick="generateKeywords()" id="genBtn">
      <span>🔍 MEOキーワードを分析する</span>
    </button>

  </div>

  <div class="loading" id="loading"><div class="spinner"></div>AIがキーワードを分析中...</div>

  <div class="results" id="results">
    <div class="card">
      <h2>推奨MEOキーワード（20個）</h2>
      <p class="copy-hint">キーワードをクリックするとコピーできます</p>

      <div class="kw-section" id="kwSection1">
        <div class="intent-label type1" id="intentLabel1">情報収集系</div>
        <div class="kw-chips" id="kwChips1"></div>
      </div>
      <div class="kw-section" id="kwSection2">
        <div class="intent-label type2" id="intentLabel2">比較検討系</div>
        <div class="kw-chips" id="kwChips2"></div>
      </div>
      <div class="kw-section" id="kwSection3">
        <div class="intent-label type3" id="intentLabel3">購買・依頼系</div>
        <div class="kw-chips" id="kwChips3"></div>
      </div>
      <div class="kw-section" id="kwSection4">
        <div class="intent-label type4" id="intentLabel4">緊急・近接系</div>
        <div class="kw-chips" id="kwChips4"></div>
      </div>
    </div>

    <div class="card">
      <h2>競合が使いそうなキーワード</h2>
      <p class="copy-hint">クリックでコピー</p>
      <div class="kw-chips" id="competitorChips"></div>
    </div>

    <div class="card">

      <div class="gbp-template" id="gbpTemplate"></div>

<div class="toast" id="toast"></div>

</footer>

<script>
function saveApiKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (key) { localStorage.setItem('anthropic_api_key', key); showToast('APIキーを保存しました'); }
}
window.onload = () => {
  const saved = localStorage.getItem('anthropic_api_key');
  if (saved) document.getElementById('apiKey').value = saved;
};

async function generateKeywords() {
  const apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('anthropic_api_key');
  if (!apiKey) { showError('APIキーを入力してください。'); return; }

  const industry = document.getElementById('industry').value;
  const area = document.getElementById('area').value || '市区町村';
  const service = document.getElementById('service').value || industry;

  hideError();
  document.getElementById('loading').classList.add('show');
  document.getElementById('results').classList.remove('show');
  document.getElementById('genBtn').disabled = true;

  const prompt = `あなたはMEO（マップエンジン最適化）の専門家です。
以下の条件でMEOキーワード分析を行ってください。

【条件】
- 業種: ${industry}
- エリア: ${area}
- メインサービス: ${service}

以下のJSON形式で出力してください（前置き・説明不要）：
{
  "recommended": {
    "info": {"label": "情報収集系", "keywords": ["kw1", "kw2", "kw3", "kw4", "kw5"]},
    "compare": {"label": "比較検討系", "keywords": ["kw1", "kw2", "kw3", "kw4", "kw5"]},
    "purchase": {"label": "購買・依頼系", "keywords": ["kw1", "kw2", "kw3", "kw4", "kw5"]},
    "urgent": {"label": "緊急・近接系", "keywords": ["kw1", "kw2", "kw3", "kw4", "kw5"]}
  },
  "competitor": ["kw1", "kw2", "kw3", "kw4", "kw5", "kw6", "kw7", "kw8"],
  "gbp_description": "GBPの説明文テンプレート（750文字以内、${area}の${industry}専門店として自然な文章で、主要キーワードを含む）"
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-calls': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `APIエラー: ${res.status}`); }

    const data = await res.json();
    const raw = data.content[0].text;
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('レスポンスの解析に失敗しました');
    const parsed = JSON.parse(jsonMatch[0]);

    renderKeywords(parsed);
    document.getElementById('results').classList.add('show');
  } catch (e) {
    showError(e.message);
  } finally {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('genBtn').disabled = false;
  }
}

function renderKeywords(data) {
  const cats = [
    { key: 'info', idx: 1, cls: 'type1' },
    { key: 'compare', idx: 2, cls: 'type2' },
    { key: 'purchase', idx: 3, cls: 'type3' },
    { key: 'urgent', idx: 4, cls: 'type4' }
  ];
  cats.forEach(cat => {
    const d = data.recommended[cat.key];
    document.getElementById('intentLabel' + cat.idx).textContent = d.label;
    document.getElementById('intentLabel' + cat.idx).className = 'intent-label ' + cat.cls;
    const chips = document.getElementById('kwChips' + cat.idx);
    chips.innerHTML = '';
    d.keywords.forEach(kw => {
      const el = document.createElement('span');
      el.className = 'kw-chip';
      el.textContent = kw;
      el.onclick = () => { navigator.clipboard.writeText(kw); showToast(kw + ' をコピーしました'); };
      chips.appendChild(el);
    });
  });

  const compChips = document.getElementById('competitorChips');
  compChips.innerHTML = '';
  data.competitor.forEach(kw => {
    const el = document.createElement('span');
    el.className = 'kw-chip competitor';
    el.textContent = kw;
    el.onclick = () => { navigator.clipboard.writeText(kw); showToast(kw + ' をコピーしました'); };
    compChips.appendChild(el);
  });

  document.getElementById('gbpTemplate').textContent = data.gbp_description;
}

function copyGbp() {
  const text = document.getElementById('gbpTemplate').textContent;
  navigator.clipboard.writeText(text).then(() => showToast('説明文をコピーしました'));
}

function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = '⚠ ' + msg; el.style.display = 'block'; }
function hideError() { document.getElementById('errorMsg').style.display = 'none'; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
