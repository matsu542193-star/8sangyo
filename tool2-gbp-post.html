 <script>
  (function(){
     var PASS='8000';
     var KEY='auth_8sangyo';
     if(sessionStorage.getItem(KEY)!=='1'){
          var overlay=document.createElement('div');
          overlay.id='pw-overlay';
          overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:#1a2e4a;display:flex;align-items:center;justify-content:center;z-index:99999';
          overlay.innerHTML='<div style="background:#fff;border-radius:16px;padding:40px 32px;max-width:360px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3)"><div style="font-size:2.5rem;margin-bottom:12px">&#128272;</div><h2 style="color:#1a2e4a;font-family:sans-serif;margin-bottom:8px">MEO&#215;AIコンサルツール</h2><p style="color:#666;font-size:0.85rem;font-family:sans-serif;margin-bottom:20px">パスワードを入力してください</p><input id="pw-input" type="password" placeholder="パスワード" style="width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:1rem;outline:none;box-sizing:border-box;margin-bottom:12px"><div id="pw-err" style="color:#c00;font-size:0.8rem;font-family:sans-serif;min-height:18px;margin-bottom:8px"></div><button id="pw-btn" style="width:100%;padding:12px;background:#d4a017;color:#1a2e4a;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;font-family:sans-serif">入る &#8594;</button></div>';

  .generate-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #1a2e4a, #243b5a); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; margin-top: 8px; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .generate-btn:hover { opacity: 0.9; }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .patterns-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

  .pattern-card { border: 1.5px solid #dde3ee; border-radius: 10px; overflow: hidden; }
  .pattern-header { background: #1a2e4a; color: #fff; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
  .pattern-header .label { font-size: 0.82rem; font-weight: 700; }
  .pattern-header .char { font-size: 0.75rem; color: #d4a017; }
  .pattern-body { padding: 16px; font-size: 0.9rem; line-height: 1.8; white-space: pre-wrap; color: #1a2e4a; min-height: 60px; }

  .pattern-footer { padding: 8px 16px 12px; display: flex; justify-content: flex-end; }
  .copy-btn { background: #d4a017; color: #1a2e4a; border: none; padding: 7px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.82rem; font-family: inherit; transition: opacity 0.2s; }
  .copy-btn:hover { opacity: 0.85; }
  .copy-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .loading { display: none; text-align: center; padding: 40px; color: #1a2e4a; }
  .loading.show { display: block; }
  .spinner { width: 36px; height: 36px; border: 4px solid #e8ecf2; border-top-color: #1a2e4a; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg { color: #c0392b; font-size: 0.85rem; background: #fff5f5; border: 1px solid #fcc; border-radius: 8px; padding: 10px 14px; margin-top: 10px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1a2e4a; color: #fff; padding: 10px 24px; border-radius: 30px; font-size: 0.85rem; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<body>

<div class="api-bar">

<div class="container">
  <div class="card">
    <h2>Googleマップ投稿文AI生成ツール</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>業種</label>
        <select id="industry">
          <option value="蜂の巣駆除">蜂の巣駆除</option>
          <option value="害虫駆除">害虫駆除</option>
          <option value="害獣駆除">害獣駆除</option>
          <option value="清掃業">清掃業</option>
          <option value="リフォーム">リフォーム</option>
          <option value="飲食店">飲食店</option>
          <option value="美容院">美容院</option>
          <option value="整体・治療院">整体・治療院</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="form-group">
        <label>季節</label>
        <select id="season">
          <option value="春（3〜5月）">春（3〜5月）</option>
          <option value="夏（6〜8月）">夏（6〜8月）</option>
          <option value="秋（9〜11月）">秋（9〜11月）</option>
          <option value="冬（12〜2月）">冬（12〜2月）</option>
        </select>
      </div>
      <div class="form-group">
        <label>エリア</label>
        <input type="text" id="area" placeholder="例：埼玉県飯能市">
      </div>
      <div class="form-group">
        <label>店舗名（任意）</label>
        <input type="text" id="shopName" placeholder="例：蜂の巣駆除産業">
      </div>
      <div class="form-group full">
        <label>投稿の目的</label>
        <div class="purpose-btns">
          <button class="purpose-btn active" data-val="集客" onclick="setPurpose(this)">🎯 集客</button>
          <button class="purpose-btn" data-val="告知" onclick="setPurpose(this)">📢 告知・お知らせ</button>
          <button class="purpose-btn" data-val="実績紹介" onclick="setPurpose(this)">🏆 実績紹介</button>
        </div>
      </div>
      <div class="form-group full">
        <label>追加情報・アピールポイント（任意）</label>
        <input type="text" id="extra" placeholder="例：即日対応可、見積無料、地域最安値など">
      </div>
    </div>
    <button class="generate-btn" onclick="generatePosts()" id="genBtn">
      <span>✨ 投稿文を3パターン生成する</span>
    </button>
    <div id="errorMsg" class="error-msg" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>生成された投稿文（3パターン）</h2>
    <div class="loading" id="loading"><div class="spinner"></div>AIが投稿文を生成中...</div>
    <div class="patterns-grid" id="patternsGrid">
      <div class="pattern-card">
        <div class="pattern-header"><span class="label">パターン 1</span><span class="char" id="c1">-文字</span></div>
        <div class="pattern-body empty" id="p1">投稿文がここに表示されます</div>
        <div class="pattern-footer"><button class="copy-btn" onclick="copyPattern(1)" id="cp1" disabled>📋 コピー</button></div>
      </div>
      <div class="pattern-card">
        <div class="pattern-header"><span class="label">パターン 2</span><span class="char" id="c2">-文字</span></div>
        <div class="pattern-body empty" id="p2">投稿文がここに表示されます</div>
        <div class="pattern-footer"><button class="copy-btn" onclick="copyPattern(2)" id="cp2" disabled>📋 コピー</button></div>
      </div>
      <div class="pattern-card">
        <div class="pattern-header"><span class="label">パターン 3</span><span class="char" id="c3">-文字</span></div>
        <div class="pattern-body empty" id="p3">投稿文がここに表示されます</div>
        <div class="pattern-footer"><button class="copy-btn" onclick="copyPattern(3)" id="cp3" disabled>📋 コピー</button></div>
      </div>
    </div>

<div class="toast" id="toast"></div>

<footer style="text-align:center;padding:24px 16px;font-size:0.78rem;color:#999;border-top:1px solid #e8ecf2;margin-top:8px;background:#fff;">

</footer>

<script>
let currentPurpose = '集客';

function saveApiKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (key) { localStorage.setItem('anthropic_api_key', key); showToast('APIキーを保存しました'); }
}
window.onload = () => {
  const saved = localStorage.getItem('anthropic_api_key');
  if (saved) document.getElementById('apiKey').value = saved;
  setSeason();
};

function setSeason() {
  const m = new Date().getMonth() + 1;
  const s = document.getElementById('season');
  if (m >= 3 && m <= 5) s.value = '春（3〜5月）';
  else if (m >= 6 && m <= 8) s.value = '夏（6〜8月）';
  else if (m >= 9 && m <= 11) s.value = '秋（9〜11月）';
  else s.value = '冬（12〜2月）';
}

function setPurpose(btn) {
  currentPurpose = btn.dataset.val;
  document.querySelectorAll('.purpose-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

async function generatePosts() {
  const apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('anthropic_api_key');
  if (!apiKey) { showError('APIキーを入力してください。'); return; }

  const industry = document.getElementById('industry').value;
  const season = document.getElementById('season').value;
  const area = document.getElementById('area').value || '埼玉県';
  const shopName = document.getElementById('shopName').value || industry;
  const extra = document.getElementById('extra').value;

  hideError();
  setLoading(true);

  const prompt = `あなたはMEO・Googleビジネスプロフィール（GBP）の専門家です。
以下の条件でGoogleマップの投稿文を3パターン作成してください。

【条件】
- 業種: ${industry}
- 店舗名: ${shopName}
- エリア: ${area}
- 季節: ${season}
- 投稿目的: ${currentPurpose}
${extra ? `- アピールポイント: ${extra}` : ''}

【投稿文の要件】
- 各パターン300文字以内
- 関連するハッシュタグを3〜5個含める（#で始まる）
- 末尾にCTA（行動喚起）を入れる（例：お気軽にご連絡ください、詳しくはプロフィールへ等）
- 各パターンはトーンを変える（例：フレンドリー/プロフェッショナル/緊急性訴求）
- 自然な日本語で読みやすく

以下のJSON形式で出力してください（前置き・説明不要）：
{
  "patterns": [
    {"tone": "フレンドリー", "text": "投稿文1"},
    {"tone": "プロフェッショナル", "text": "投稿文2"},
    {"tone": "緊急性訴求", "text": "投稿文3"}
  ]
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-calls': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `APIエラー: ${res.status}`); }

    const data = await res.json();
    const raw = data.content[0].text;
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('レスポンスの解析に失敗しました');
    const parsed = JSON.parse(jsonMatch[0]);

    parsed.patterns.forEach((p, i) => {
      const n = i + 1;
      const el = document.getElementById('p' + n);
      el.textContent = p.text;
      el.classList.remove('empty');
      document.getElementById('c' + n).textContent = p.text.length + '文字';
      document.getElementById('cp' + n).disabled = false;
    });
  } catch (e) {
    showError(e.message);
  } finally {
    setLoading(false);
  }
}

function setLoading(v) {
  document.getElementById('loading').classList.toggle('show', v);
  document.getElementById('patternsGrid').style.display = v ? 'none' : 'grid';
  document.getElementById('genBtn').disabled = v;
}

function copyPattern(n) {
  const text = document.getElementById('p' + n).textContent;
  navigator.clipboard.writeText(text).then(() => showToast('パターン' + n + 'をコピーしました'));
}

function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = '⚠ ' + msg; el.style.display = 'block'; }
function hideError() { document.getElementById('errorMsg').style.display = 'none'; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
