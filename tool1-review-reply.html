<html lang="ja">
<head>
 <script>
  (function(){
     var PASS='8000';
     var KEY='auth_8sangyo';
     if(sessionStorage.getItem(KEY)!='1'){
          var overlay=document.createElement('div');
          overlay.id='pw-overlay';
          overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:#1a2e4a;display:flex;align-items:center;justify-content:center;z-index:99999';
          overlay.innerHTML='<div style="background:#fff;border-radius:16px;padding:40px 32px;max-width:360px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3)"><div style="font-size:2.5rem;margin-bottom:12px">&#128272;</div><h2 style="color:#1a2e4a;font-family:sans-serif;margin-bottom:8px">MEO&#215;AIコンサルツール</h2><p style="color:#666;font-size:0.85rem;font-family:sans-serif;margin-bottom:20px">パスワードを入力してください</p><input id="pw-input" type="password" placeholder="パスワード" style="width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:1rem;outline:none;box-sizing:border-box;margin-bottom:12px"><div id="pw-err" style="color:#c00;font-size:0.8rem;font-family:sans-serif;min-height:18px;margin-bottom:8px"></div><button id="pw-btn" style="width:100%;padding:12px;background:#d4a017;color:#1a2e4a;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;font-family:sans-serif">入る &#8594;</button></div>';
          document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(overlay);document.getElementById('pw-input').focus();});
          function checkPw(){var v=document.getElementById('pw-input').value;if(v===PASS){sessionStorage.setItem(KEY,'1');document.getElementById('pw-overlay').remove();}else{document.getElementById('pw-err').textContent='パスワードが違います';document.getElementById('pw-input').value='';document.getElementById('pw-input').focus();}}
          document.addEventListener('DOMContentLoaded',function(){document.getElementById('pw-btn').addEventListener('click',checkPw);document.getElementById('pw-input').addEventListener('keydown',function(e){if(e.key==='Enter')checkPw();});});
     }
  })();
 </script>

  }
  select:focus, input:focus, textarea:focus { border-color: #1a2e4a; background: #fff; }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

  .star-group { display: flex; gap: 8px; align-items: center; }
  .star-btn {
    background: none;
    border: 1.5px solid #dde3ee;
    border-radius: 8px;

  .star-btn.active { background: #fff8e1; border-color: #d4a017; color: #d4a017; }
  .star-btn:hover { border-color: #d4a017; }

  .generate-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1a2e4a, #243b5a);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 8px;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .generate-btn:hover { opacity: 0.9; }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .result-box {
    background: #f8faff;
    border: 1.5px solid #dde3ee;
    border-radius: 10px;
    padding: 18px;
    min-height: 80px;
    font-size: 0.92rem;
    line-height: 1.8;
    color: #1a2e4a;
    white-space: pre-wrap;
    position: relative;
  }
  .result-box.empty { color: #aaa; font-style: italic; }

  .result-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
  .copy-btn {
    background: #d4a017;
    color: #1a2e4a;
    border: none;
    padding: 8px 20px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
    transition: opacity 0.2s;
  }
  .copy-btn:hover { opacity: 0.85; }
  .copy-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .loading { display: none; text-align: center; padding: 24px; color: #1a2e4a; }
  .loading.show { display: block; }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid #e8ecf2;
    border-top-color: #1a2e4a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg { color: #c0392b; font-size: 0.85rem; background: #fff5f5; border: 1px solid #fcc; border-radius: 8px; padding: 10px 14px; margin-top: 10px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1a2e4a; color: #fff; padding: 10px 24px; border-radius: 30px;
    font-size: 0.85rem; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .char-count { font-size: 0.75rem; color: #888; text-align: right; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>🐝 MEO×AIコンサル｜蜂の巣駆除産業</h1>
  <span class="badge">飯能・入間・所沢・青梅・坂戸熊谷</span>
</header>

<div class="api-bar">
  <label>Anthropic APIキー</label>
  <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
  <button onclick="saveApiKey()">保存</button>
</div>

<nav>
  <a href="tool1-review-reply.html" class="active">口コミ返信</a>
  <a href="tool2-gbp-post.html">GBP投稿文</a>
  <a href="tool3-keyword.html">MEOキーワード</a>
  <a href="tool4-report.html">月次レポート</a>
  <a href="tool5-meo-analysis.html">MEO診断</a>
</nav>

<div class="container">
  <div class="card">
    <h2>口コミ自動返信ジェネレーター</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>支部エリア</label>
        <select id="branch">
          <option value="飯能">飯能支部</option>
          <option value="入間">入間支部</option>
          <option value="所沢">所沢支部</option>
          <option value="青梅">青梅支部</option>
          <option value="坂戸熊谷">坂戸熊谷支部</option>
        </select>
      </div>
      <div class="form-group">
        <label>業種</label>
        <select id="industry">
          <option value="蜂の巣駆除">蜂の巣駆除</option>
          <option value="害虫駆除">害虫駆除</option>
          <option value="害獣駆除">害獣駆除</option>
          <option value="清掃業">清掃業</option>
          <option value="リフォーム">リフォーム</option>
          <option value="飲食店">飲食店</option>
          <option value="美容院">美容院</option>
          <option value="整体・治療院">整体・治療院</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="form-group full">
        <label>星評価</label>
        <div class="star-group" id="starGroup">
          <button class="star-btn" data-val="1" onclick="setStar(1)">★1</button>
          <button class="star-btn" data-val="2" onclick="setStar(2)">★★2</button>
          <button class="star-btn" data-val="3" onclick="setStar(3)">★★★3</button>
          <button class="star-btn" data-val="4" onclick="setStar(4)">★★★★4</button>
          <button class="star-btn active" data-val="5" onclick="setStar(5)">★★★★★5</button>
        </div>
      </div>
      <div class="form-group full">
        <label>口コミ内容</label>
        <textarea id="reviewText" placeholder="お客様の口コミをここに貼り付けてください..." oninput="updateCount()"></textarea>
        <div class="char-count" id="charCount">0文字</div>
      </div>
      <div class="form-group full">
        <label>店舗名（任意）</label>
        <input type="text" id="shopName" placeholder="例：蜂の巣駆除産業 飯能店">
      </div>
    </div>
    <button class="generate-btn" onclick="generateReply()" id="genBtn">
      <span>✨ AI返信文を生成する</span>
    </button>
    <div id="errorMsg" class="error-msg" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>生成された返信文</h2>
    <div class="loading" id="loading"><div class="spinner"></div>AIが返信文を生成中...</div>
    <div class="result-box empty" id="resultBox">返信文がここに表示されます</div>
    <div class="result-actions">
      <button class="copy-btn" onclick="copyResult()" id="copyBtn" disabled>📋 コピー</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">コピーしました！</div>

<footer style="text-align:center;padding:24px 16px;font-size:0.78rem;color:#999;border-top:1px solid #e8ecf2;margin-top:8px;background:#fff;">
  <strong style="color:#1a2e4a;">MEO×AI ツールズ by 蜂の巣駆除産業</strong><br>
  運営：松木裕和（蜂の巣駆除産業）｜
  <a href="https://8sangyo.com/" target="_blank" rel="noopener" style="color:#d4a017;">https://8sangyo.com/</a>｜
  TEL：<a href="tel:07026706907" style="color:#d4a017;">070-2670-6907</a>
</footer>

<script>
let currentStar = 5;

function saveApiKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (key) {
    localStorage.setItem('anthropic_api_key', key);
    showToast('APIキーを保存しました');
  }
}

window.onload = () => {
  const saved = localStorage.getItem('anthropic_api_key');
  if (saved) document.getElementById('apiKey').value = saved;
};

function setStar(n) {
  currentStar = n;
  document.querySelectorAll('.star-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.val) === n);
  });
}

function updateCount() {
  const len = document.getElementById('reviewText').value.length;
  document.getElementById('charCount').textContent = len + '文字';
}

async function generateReply() {
  const apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('anthropic_api_key');
  if (!apiKey) {
    showError('APIキーを入力してください。');
    return;
  }
  const review = document.getElementById('reviewText').value.trim();
  if (!review) {
    showError('口コミ内容を入力してください。');
    return;
  }

  const branch = document.getElementById('branch').value;
  const industry = document.getElementById('industry').value;
  const shopName = document.getElementById('shopName').value || `${industry} ${branch}店`;

  hideError();
  setLoading(true);

  const prompt = `あなたは${branch}エリアの${industry}店舗「${shopName}」のオーナーです。
以下のGoogleマップの口コミ（★${currentStar}）に対して、丁寧でプロフェッショナルな返信文を日本語で作成してください。

【口コミ内容】
${review}

【返信文の条件】
- 200文字以内
- 感謝の言葉から始める
- ${currentStar <= 3 ? '低評価なので謝罪と改善の意思を示す' : '高評価への感謝と再来店の促し'}
- 自然で温かみのある文体
- 店舗名「${shopName}」を1回使用
- 末尾に署名不要

返信文のみ出力してください（前置きや説明は不要）。`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5',
        max_tokens: 512,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `APIエラー: ${res.status}`);
    }

    const data = await res.json();
    const text = data.content[0].text;
    showResult(text);
  } catch (e) {
    showError(e.message);
  } finally {
    setLoading(false);
  }
}

function setLoading(v) {
  document.getElementById('loading').classList.toggle('show', v);
  document.getElementById('resultBox').style.display = v ? 'none' : 'block';
  document.getElementById('genBtn').disabled = v;
}

function showResult(text) {
  const box = document.getElementById('resultBox');
  box.textContent = text;
  box.classList.remove('empty');
  document.getElementById('copyBtn').disabled = false;
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}
function hideError() { document.getElementById('errorMsg').style.display = 'none'; }

function copyResult() {
  const text = document.getElementById('resultBox').textContent;
  navigator.clipboard.writeText(text).then(() => showToast('コピーしました！'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
